name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Storage tests (JavaScript)
        run: node tools/test/db.test.js
      - name: Storage tests (Java)
        run: |
          mkdir -p /tmp/store-test
          javac -d /tmp/store-test tools/test/java/android/content/Context.java app/src/main/java/dev/stride/app/Store.java tools/test/java/dev/stride/app/StoreTest.java
          java -cp /tmp/store-test dev.stride.app.StoreTest
      # GitHub's Ubuntu runners come with the Android SDK; setup-android@v3 no longer works on them.
      - name: Use the preinstalled Android SDK
        run: |
          test -d "$ANDROID_HOME" || { echo "ANDROID_HOME is not set on this runner"; exit 1; }
          echo "Android SDK: $ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Stride-apk
          path: app/build/outputs/apk/release/*.apk
